version: '3.8'

services:
  backend:
    build: ./backend/inventorysimulator
    ports:
      - "8080:8080"
    networks:
      - app-network

  frontend:
    build: ./frontend/inventorysim-app
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
